name: Android

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and verify Maven publication
        run: ./gradlew :android:assembleRelease :android:lintRelease :android:publishReleasePublicationToMavenLocal --no-daemon
